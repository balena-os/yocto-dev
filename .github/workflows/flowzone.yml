name: Flowzone

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches:
      - main
      - master
  push:
    branches: [main, master]

jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master # flowzonify 0.4.21
    secrets: inherit
    with:
      balena_slugs: balena_os/yocto-dev
      jobs_timeout_minutes: 60
